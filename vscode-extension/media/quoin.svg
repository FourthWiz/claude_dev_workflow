<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Quoin Activity Bar icon — isometric cube with Q ring carved into the right face.
    Monochrome; VS Code recolors via currentColor mask.

    Right-face Q technique (fill-rule=evenodd):
      polygon  → fills right face
      circle r=2.4  → punches annular outer boundary (toggles region off)
      circle r=1.4  → re-fills center (toggles back on)
    Result: right face with a transparent ring carved out, center still filled.
    Q tail added as a separate filled rect rotated 45°.
  -->

  <!-- Left face: full opacity — deepest visual weight -->
  <polygon points="2,8 10,4 10,18 2,22" fill="currentColor"/>

  <!-- Top face: 55% opacity -->
  <polygon points="2,8 10,4 22,8 14,12" fill="currentColor" opacity="0.55"/>

  <!-- Right face with Q ring carved out -->
  <g fill="currentColor" opacity="0.80" fill-rule="evenodd">
    <polygon points="14,12 22,8 22,20 14,24"/>
    <circle cx="18.2" cy="16.4" r="2.4"/>
    <circle cx="18.2" cy="16.4" r="1.4"/>
  </g>

  <!-- Q tail: small diagonal bar at bottom-right of ring -->
  <rect x="19.4" y="18.2" width="1.0" height="2.0" rx="0.4"
        transform="rotate(-45 19.9 19.2)"
        fill="currentColor" opacity="0.80"/>
</svg>
