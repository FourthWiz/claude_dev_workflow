<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quoin Dashboard</title>
  <!-- Inline SVG favicon — avoids /favicon.ico 404 (server only serves 4 fixed paths) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236c63ff'/><text x='16' y='22' text-anchor='middle' font-family='monospace' font-size='18' fill='white'>q</text></svg>">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <header class="app-header">
    <h1>Quoin Dashboard</h1>
    <div class="header-controls">
      <label class="toggle-label">
        <input type="checkbox" id="show-finalized">
        Show finalized
      </label>
      <input type="search" id="task-search" class="task-search" placeholder="Filter tasks…" aria-label="Filter tasks by name">
    </div>
    <details class="phase-legend">
      <summary>Phase legend</summary>
      <ul>
        <li><span class="phase-chip phase-discover">discover</span> Discovery scan</li>
        <li><span class="phase-chip phase-architect">architect</span> Architecture review</li>
        <li><span class="phase-chip phase-thorough_plan">Plan</span> Planning</li>
        <li><span class="phase-chip phase-implement">implement</span> Implementation</li>
        <li><span class="phase-chip phase-review">review</span> Review</li>
        <li><span class="phase-chip phase-end_of_task">Done</span> Completed</li>
      </ul>
    </details>
  </header>

  <main class="app-body">
    <section class="task-table-region" id="task-table-region">
      <div id="task-card-list" role="list">
        <p class="loading">Loading tasks…</p>
      </div>
    </section>

    <section class="detail-pane" id="detail-pane">
      <p class="detail-placeholder">Select a task to see details.</p>
    </section>
  </main>

  <noscript>
    <p style="padding:20px">JavaScript is required to display the Quoin dashboard. Enable JavaScript in your browser.</p>
  </noscript>

  <script src="./app.js"></script>
</body>
</html>
