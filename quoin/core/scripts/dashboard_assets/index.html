<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quoin Dashboard</title>
  <!-- Inline SVG favicon (base64) — avoids /favicon.ico 404; base64-encoded to avoid xmlns URL tripping the no-external-URL test -->
  <!-- D-13: the implement/in-progress phase is indistinguishable from plan/in-progress without a git probe -->
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNicgZmlsbD0nI2M4OWIzYycvPjx0ZXh0IHg9JzE2JyB5PScyMicgdGV4dC1hbmNob3I9J21pZGRsZScgZm9udC1mYW1pbHk9J21vbm9zcGFjZScgZm9udC1zaXplPScxOCcgZmlsbD0nd2hpdGUnPnE8L3RleHQ+PC9zdmc+">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <header class="app-header">
    <h1>Quoin Dashboard</h1>
    <div class="header-controls">
      <label class="toggle-label">
        <input type="checkbox" id="show-finalized">
        Show finalized
      </label>
      <input type="search" id="task-search" class="task-search" placeholder="Filter tasks…" aria-label="Filter tasks by name">
    </div>
    <details class="phase-legend">
      <summary>Phase legend</summary>
      <ul>
        <li><span class="phase-chip phase-discover">discover</span> Discovery scan</li>
        <li><span class="phase-chip phase-architect">architect</span> Architecture review</li>
        <li><span class="phase-chip phase-thorough_plan">Plan</span> Planning</li>
        <li><span class="phase-chip phase-implement">implement</span> Implementation</li>
        <li><span class="phase-chip phase-review">review</span> Review</li>
        <li><span class="phase-chip phase-end_of_task">Done</span> Completed</li>
      </ul>
    </details>
    <div id="spend-section" class="spend-section"></div>
  </header>

  <main class="app-body">
    <section class="task-table-region" id="task-table-region">
      <div id="task-card-list" role="list">
        <p class="loading">Loading tasks…</p>
      </div>
    </section>

    <section class="detail-pane" id="detail-pane">
      <p class="detail-placeholder">Select a task to see details.</p>
    </section>
  </main>

  <section id="memory-pane" class="memory-pane">
    <div class="mem-type-bar">
      <span class="mem-type-label">Memory</span>
      <button class="mem-type-btn active" data-mtype="lessons">Lessons</button>
      <button class="mem-type-btn" data-mtype="sessions">Sessions</button>
      <button class="mem-type-btn" data-mtype="insights">Insights</button>
    </div>
    <div class="mem-body">
      <ul id="mem-item-list" class="mem-item-list">
        <li class="mem-empty">Loading…</li>
      </ul>
      <div id="mem-item-viewer" class="mem-item-viewer">
        <p class="mem-placeholder">Select an item to view.</p>
      </div>
    </div>
  </section>

  <noscript>
    <p style="padding:20px">JavaScript is required to display the Quoin dashboard. Enable JavaScript in your browser.</p>
  </noscript>

  <script src="./app.js"></script>
  <script src="./memory.js"></script>
</body>
</html>
